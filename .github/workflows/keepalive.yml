name: Backend keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /status
        env:
          BACKEND_URL: ${{ vars.NEXUS_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Set the NEXUS_BACKEND_URL repo variable (Settings > Secrets and variables > Actions > Variables) to your Render backend URL."
            exit 1
          fi
          curl -fsS --max-time 20 "$BACKEND_URL/status"
