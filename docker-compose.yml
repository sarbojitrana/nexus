services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "N3xus!DevOnly"
      # Local dev boxes are often near-full; don't let OpenSearch's disk
      # watermark flip the cluster read-only over a few free GB.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - nexus_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      NEXUS_PRIMARY.ENV: local
      NEXUS_SERVER.PORT: "8080"
      NEXUS_SERVER.READ_TIMEOUT: "10"
      NEXUS_SERVER.WRITE_TIMEOUT: "10"
      NEXUS_SERVER.IDLE_TIMEOUT: "60"
      NEXUS_SERVER.CORS_ALLOWED_ORIGINS: http://localhost:3000
      NEXUS_DATABASE.HOST: postgres
      NEXUS_DATABASE.PORT: "5432"
      NEXUS_DATABASE.USER: nexus
      NEXUS_DATABASE.PASSWORD: nexus
      NEXUS_DATABASE.NAME: nexus
      NEXUS_DATABASE.SSL_MODE: disable
      NEXUS_DATABASE.MAX_OPEN_CONNS: "20"
      NEXUS_DATABASE.MAX_IDLE_CONNS: "5"
      NEXUS_DATABASE.CONN_MAX_LIFETIME: "300"
      NEXUS_DATABASE.CONN_MAX_IDLE_TIME: "60"
      NEXUS_REDIS.ADDRESS: redis:6379
      NEXUS_SEARCH.URL: http://opensearch:9200
      NEXUS_AWS.REGION: ${NEXUS_AWS_REGION:-}
      NEXUS_AWS.ACCESS_KEY_ID: ${NEXUS_AWS_ACCESS_KEY_ID:-}
      NEXUS_AWS.SECRET_ACCESS_KEY: ${NEXUS_AWS_SECRET_ACCESS_KEY:-}
      NEXUS_AWS.ENDPOINT_URL: ${NEXUS_AWS_ENDPOINT_URL:-}
      NEXUS_AWS.UPLOAD_BUCKET: ${NEXUS_AWS_UPLOAD_BUCKET:-}
      NEXUS_AUTH.SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in your .env}
      NEXUS_AUTH.WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?Set CLERK_WEBHOOK_SECRET in your .env}
      NEXUS_INTEGRATION.SMTP_HOST: smtp.gmail.com
      NEXUS_INTEGRATION.SMTP_PORT: "587"
      NEXUS_INTEGRATION.SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:?Set GMAIL_SMTP_USERNAME in your .env}
      NEXUS_INTEGRATION.SMTP_PASSWORD: ${GMAIL_SMTP_PASSWORD:?Set GMAIL_SMTP_PASSWORD in your .env}
      NEXUS_INTEGRATION.SMTP_FROM: ${GMAIL_SMTP_FROM:?Set GMAIL_SMTP_FROM in your .env}
      NEXUS_OBSERVABILITY.SERVICE_NAME: nexus
      NEXUS_OBSERVABILITY.ENVIRONMENT: development
      NEXUS_OBSERVABILITY.LOGGING.LEVEL: debug
      NEXUS_OBSERVABILITY.LOGGING.FORMAT: console
      NEXUS_OBSERVABILITY.LOGGING.SLOW_QUERY_THRESHOLD: 100ms
      NEXUS_OBSERVABILITY.NEW_RELIC.LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEXUS_OBSERVABILITY.NEW_RELIC.APP_LOG_FORWARDING_ENABLED: "true"
      NEXUS_OBSERVABILITY.NEW_RELIC.DISTRIBUTED_TRACING_ENABLED: "true"
      NEXUS_OBSERVABILITY.NEW_RELIC.DEBUG_LOGGING: "false"
      NEXUS_OBSERVABILITY.HEALTH_CHECKS.ENABLED: "true"
      NEXUS_OBSERVABILITY.HEALTH_CHECKS.INTERVAL: 30s
      NEXUS_OBSERVABILITY.HEALTH_CHECKS.TIMEOUT: 5s

volumes:
  nexus_postgres_data:
  nexus_redis_data:
  nexus_opensearch_data:
