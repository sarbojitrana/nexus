services:
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    region: oregon
    healthCheckPath: /status
    envVars:
      - key: NEXUS_PRIMARY.ENV
        value: production
      - key: NEXUS_SERVER.PORT
        value: "10000"
      - key: NEXUS_SERVER.READ_TIMEOUT
        value: "10"
      - key: NEXUS_SERVER.WRITE_TIMEOUT
        value: "10"
      - key: NEXUS_SERVER.IDLE_TIMEOUT
        value: "60"
      - key: NEXUS_SERVER.CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://nexus.vercel.app
      # External always-free Postgres (e.g. Neon) -- Render's own free
      # Postgres deletes all data after 30 days, unsuitable for real user data.
      - key: NEXUS_DATABASE.HOST
        sync: false
      - key: NEXUS_DATABASE.PORT
        value: "5432"
      - key: NEXUS_DATABASE.USER
        sync: false
      - key: NEXUS_DATABASE.PASSWORD
        sync: false
      - key: NEXUS_DATABASE.NAME
        sync: false
      - key: NEXUS_DATABASE.SSL_MODE
        value: require
      - key: NEXUS_DATABASE.MAX_OPEN_CONNS
        value: "10"
      - key: NEXUS_DATABASE.MAX_IDLE_CONNS
        value: "5"
      - key: NEXUS_DATABASE.CONN_MAX_LIFETIME
        value: "300"
      - key: NEXUS_DATABASE.CONN_MAX_IDLE_TIME
        value: "60"
      - key: NEXUS_REDIS.ADDRESS
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString
      - key: NEXUS_AUTH.SECRET_KEY
        sync: false
      - key: NEXUS_AUTH.WEBHOOK_SECRET
        sync: false
      - key: NEXUS_INTEGRATION.SMTP_HOST
        value: smtp.gmail.com
      - key: NEXUS_INTEGRATION.SMTP_PORT
        value: "587"
      - key: NEXUS_INTEGRATION.SMTP_USERNAME
        sync: false # your Gmail address
      - key: NEXUS_INTEGRATION.SMTP_PASSWORD
        sync: false # Gmail App Password, not your account password
      - key: NEXUS_INTEGRATION.SMTP_FROM
        sync: false # e.g. "Nexus <your.address@gmail.com>"
      - key: NEXUS_OBSERVABILITY.SERVICE_NAME
        value: nexus
      - key: NEXUS_OBSERVABILITY.ENVIRONMENT
        value: production
      - key: NEXUS_OBSERVABILITY.LOGGING.LEVEL
        value: info
      - key: NEXUS_OBSERVABILITY.LOGGING.FORMAT
        value: json
      - key: NEXUS_OBSERVABILITY.LOGGING.SLOW_QUERY_THRESHOLD
        value: 200ms
      - key: NEXUS_OBSERVABILITY.NEW_RELIC.LICENSE_KEY
        sync: false
      - key: NEXUS_OBSERVABILITY.NEW_RELIC.APP_LOG_FORWARDING_ENABLED
        value: "true"
      - key: NEXUS_OBSERVABILITY.NEW_RELIC.DISTRIBUTED_TRACING_ENABLED
        value: "true"
      - key: NEXUS_OBSERVABILITY.NEW_RELIC.DEBUG_LOGGING
        value: "false"
      - key: NEXUS_OBSERVABILITY.HEALTH_CHECKS.ENABLED
        value: "true"
      - key: NEXUS_OBSERVABILITY.HEALTH_CHECKS.INTERVAL
        value: 30s
      - key: NEXUS_OBSERVABILITY.HEALTH_CHECKS.TIMEOUT
        value: 5s
      # S3-compatible object storage for chat attachments (Cloudflare R2 --
      # free forever, zero egress). Uploads stay disabled until these are set.
      - key: NEXUS_AWS.REGION
        sync: false # e.g. auto
      - key: NEXUS_AWS.ACCESS_KEY_ID
        sync: false
      - key: NEXUS_AWS.SECRET_ACCESS_KEY
        sync: false
      - key: NEXUS_AWS.ENDPOINT_URL
        sync: false # e.g. https://<account_id>.r2.cloudflarestorage.com
      - key: NEXUS_AWS.UPLOAD_BUCKET
        sync: false
      # OpenSearch for post/people/community search (Bonsai free Sandbox
      # plan -- free forever). Search stays disabled until this is set.
      - key: NEXUS_SEARCH.URL
        sync: false # e.g. https://<cluster>.a.bonsaisearch.net
      - key: NEXUS_SEARCH.USERNAME
        sync: false
      - key: NEXUS_SEARCH.PASSWORD
        sync: false

  - type: keyvalue
    name: nexus-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
